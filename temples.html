<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="a responsive temple album page designed to show temples, their name, location and more, using JavaScript, CSS and HTML.">
  <meta name="author" content="Franco Chumba">
  <title>Temple Album</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/temples.css">
  <link rel="stylesheet" href="styles/temples-large.css">

  <script src="scripts/temples.js" defer></script>
</head>
<body>
<header>
  <h2>Temple Album</h2>
  <button id="menuBtn" aria-label="Menu">☰</button>
  <nav id="navMenu">
    <a href="#">Home</a>
    <a href="#">Old</a>
    <a href="#">New</a>
    <a href="#">Large</a>
    <a href="#">Small</a>
  </nav>
</header>
<main>
  <h1>Temple Pictures</h1>
  <section class="gallery">
    <figure>
      <img src="images/logan.webp" alt="Logan Utah Temple">
      <figcaption>Logan Utah Temple</figcaption>
    </figure>
    <figure>
      <img src="images/bangkok_thailand.webp" alt="Bangkok Thailand Temple">
      <figcaption>Bangkok Thailand Temple</figcaption>
    </figure>
    <figure>
      <img src="images/manhattan.webp" alt="Manhattan New York Temple">
      <figcaption>Manhattan New York Temple</figcaption>
    </figure>
    <figure>
      <img src="images/albuquerque.webp" alt="Albuquerque New Mexico Temple">

    </figure>
    <figure>
      <img src="images/kyiv_ukraine.webp" alt="Kyiv Ukraine Temple">
      <figcaption>Kyiv Ukraine Temple</figcaption>
    </figure>
    <figure>
      <img src="images/hong_kong_china.webp" alt="Hong Kong China Temple">
      <figcaption>Hong Kong China Temple</figcaption>
    </figure>
    <figure>
      <img src="images/cardston_alberta.webp" alt="Cardston Alberta Temple">
      <figcaption>Cardston Alberta Temple</figcaption>
    </figure>
    <figure>
      <img src="images/freiberg_germany.webp" alt="Freiberg Germany Temple">
      <figcaption>Freiberg Germany Temple</figcaption>
    </figure>
    <figure>
      <img src="images/copenhagen_denmark.webp" alt="Copenhagen Denmark Temple">
      <figcaption>Copenhagen Denmark Temple</figcaption>
    </figure>
  </section>
</main>
<footer>
  <p>&copy; <span id="year"></span> | Franco Chumba | Chile</p>

</html>
