<!DOCTYPE html>
<html lang="en">
<head>
<meta name="description" content="Submit a product review form including rating, installation date, useful features, and written feedback.">
<meta name="author" content="Franco Chumba Perez">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Product Review Form</title>

<link rel="stylesheet" href="styles/form.css">

<script src="scripts/form.js" defer></script>

</head>

<body>

<header>
    <h1>Product Review</h1>
</header>

<main>

<form method="get" action="review.html">

<label for="product">
Product Name
</label>

<select id="product" name="product" required>

<option value="" disabled selected>
Select a Product ...
</option>

</select>

<fieldset>

<legend>Overall Rating</legend>

<input type="radio" id="rating1" name="rating" value="1" required>
<label for="rating1">☆</label>

<input type="radio" id="rating2" name="rating" value="2" required>
<label for="rating2">☆☆</label>

<input type="radio" id="rating3" name="rating" value="3" required>
<label for="rating3">☆☆☆</label>

<input type="radio" id="rating4" name="rating" value="4" required>
<label for="rating4">☆☆☆☆</label>

<input type="radio" id="rating5" name="rating" value="5" required>
<label for="rating5">☆☆☆☆☆</label>

</fieldset>


<label for="installDate">
Date of Installation
</label>

<input type="date"
id="installDate"
name="installDate"
required>

<fieldset>

<legend>
Which features did you find useful?
</legend>

<input type="checkbox"
id="durability"
name="features"
value="durability">
<label for="durability">Durability</label>


<input type="checkbox"
id="ease"
name="features"
value="ease">
<label for="ease">Ease of Use</label>


<input type="checkbox"
id="performance"
name="features"
value="performance">
<label for="performance">Performance</label>


<input type="checkbox"
id="design"
name="features"
value="design">
<label for="design">Design</label>

</fieldset>

<label for="reviewText">
Written Review (Optional)
</label>

<textarea
id="reviewText"
name="reviewText"
rows="5">
</textarea>

<label for="username">
Your Name (Optional)
</label>

<input type="text"
id="username"
name="username">

<input type="submit"
value="Post Review">


</form>

</main>


<footer>

<p>
©2026 Franco Chumba Perez
</p>

<p id="lastModified"></p>

</footer>

</body>
</html>
